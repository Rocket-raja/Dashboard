<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#14202e;--mute:#5b6b7d;--line:#dde3ea;--up:#0b7a53;--down:#c2352b;--accent:#1f4fd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--surface:#152131;--ink:#e6edf5;--mute:#8fa1b5;--line:#25354a;--up:#3ccf91;--down:#ff6b5e;--accent:#7aa2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--surface:#152131;--ink:#e6edf5;--mute:#8fa1b5;--line:#25354a;--up:#3ccf91;--down:#ff6b5e;--accent:#7aa2ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.modes button{font:inherit;font-size:14px;padding:8px 16px;border:0;background:none;color:var(--mute);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:#fff}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.strip{display:flex;height:44px;gap:2px;border-radius:8px;overflow:hidden;margin-bottom:6px}
.strip i{flex:1;display:block}
.tone{color:var(--mute);font-size:13px;margin-bottom:22px}
.warn{background:var(--surface);border:1px solid var(--down);color:var(--down);padding:10px 12px;border-radius:8px;margin-bottom:16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 16px 8px}
h2{font-size:15px;font-weight:700;margin:12px 0 6px}
.row{display:grid;grid-template-columns:1fr auto 84px;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-of-type{border-top:0}
.nm small{display:block;color:var(--mute);font-size:12px}
.px{text-align:right}
.pc{text-align:right;font-weight:500}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.na{color:var(--mute);font-size:13px;padding:8px 0}
footer{color:var(--mute);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Market snapshot</h1>
    <div class="sub" id="meta">Loading…</div>
  </div>
  <div class="modes" role="group" aria-label="View">
    <button id="m-pre" aria-pressed="false">Pre-market</button>
    <button id="m-post" aria-pressed="false">Post-market</button>
  </div>
</header>
<div id="warn"></div>
<div class="strip" id="strip" aria-hidden="true"></div>
<div class="tone" id="tone"></div>
<div class="grid" id="grid"></div>
<footer>Data from Yahoo Finance via yfinance, refreshed by a scheduled job. Prices can be delayed or occasionally wrong. Not investment advice.</footer>
</div>
<script>
const ORDER = {
  pre:  ["us","fut","asia","eu","macro","india","watch"],
  post: ["india","asia","eu","fut","us","macro","watch"]
};
const INDEX_GROUPS = ["us","asia","eu","india"];
const $ = id => document.getElementById(id);
let DATA = null, mode = null;

function istNow(){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const h = +p.find(x=>x.type==="hour").value, m = +p.find(x=>x.type==="minute").value;
  return {h, m};
}
function defaultMode(){ const t = istNow(); return (t.h*60+t.m) < 15*60+30 ? "pre" : "post"; }
const fmt = (v,d=2) => v==null ? "–" : v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const cls = p => p==null ? "flat" : p>0.005 ? "up" : p<-0.005 ? "down" : "flat";
const arrow = p => p==null ? "" : p>0.005 ? "▲ " : p<-0.005 ? "▼ " : "";

function renderStrip(){
  const items = DATA.groups.filter(g=>INDEX_GROUPS.includes(g.id)).flatMap(g=>g.items).filter(i=>i.pct!=null && !/vix/i.test(i.name));
  $("strip").innerHTML = items.map(i=>{
    const a = Math.min(Math.abs(i.pct)/2,1)*85+10;
    const c = i.pct>=0 ? "var(--up)" : "var(--down)";
    return `<i title="${i.name} ${i.pct>=0?"+":""}${fmt(i.pct)}%" style="background:color-mix(in srgb, ${c} ${a}%, var(--surface))"></i>`;
  }).join("");
  const up = items.filter(i=>i.pct>0).length;
  $("tone").textContent = items.length ? `${up} of ${items.length} global indices are up. Each block is one index, stronger colour means a bigger move.` : "";
}

function render(){
  $("m-pre").setAttribute("aria-pressed", mode==="pre");
  $("m-post").setAttribute("aria-pressed", mode==="post");
  if(!DATA) return;
  const byId = Object.fromEntries(DATA.groups.map(g=>[g.id,g]));
  $("grid").innerHTML = ORDER[mode].filter(id=>byId[id]).map(id=>{
    const g = byId[id];
    const rows = g.items.map(i=>`
      <div class="row">
        <div class="nm">${i.name}<small>${i.symbol}${i.asof?" · "+i.asof:""}</small></div>
        <div class="px">${fmt(i.price)}</div>
        <div class="pc ${cls(i.pct)}">${arrow(i.pct)}${i.pct==null?"–":(i.pct>0?"+":"")+fmt(i.pct)+"%"}</div>
      </div>`).join("");
    return `<section><h2>${g.title}</h2>${rows||'<div class="na">No data</div>'}</section>`;
  }).join("");
}

function setMode(m){ mode = m; render(); }
$("m-pre").onclick = ()=>setMode("pre");
$("m-post").onclick = ()=>setMode("post");

async function load(){
  try{
    const r = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    DATA = await r.json();
    const gen = new Date(DATA.generated_at);
    const ist = gen.toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:true});
    $("meta").textContent = `Updated ${ist} IST`;
    const hrs = (Date.now()-gen.getTime())/36e5;
    $("warn").innerHTML = hrs>12 ? `<div class="warn">This data is ${Math.round(hrs)} hours old. Check that the scheduled update is still running.</div>` : "";
    renderStrip(); render();
  }catch(e){
    $("meta").textContent = "No data yet";
    $("warn").innerHTML = '<div class="warn">Couldn’t load data.json. Run fetch_data.py to create it, then open this page through GitHub Pages or a local server (python -m http.server), not by double-clicking the file.</div>';
  }
}
mode = defaultMode(); render(); load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
